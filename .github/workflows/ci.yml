name: CI

on:
  push:
    branches: [ release, develop, main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure

  # Compila/testea en C99 estricto: ejercita el fallback de macros tipadas
  # (sin _Generic). El target de la API unificada (annotated) se fija a C11.
  c99-fallback:
    name: C99 fallback
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure (C99)
        run: cmake -S . -B build -DCMAKE_C_STANDARD=99 -DCMAKE_C_STANDARD_REQUIRED=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ASan + UBSan en Linux: util por el uso de setjmp/longjmp y senales.
  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    env:
      CFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer -g"
      CXXFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer -g"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Comprueba que la libreria se puede instalar y consumir via find_package.
  install-and-consume:
    name: install + find_package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ctests
        run: |
          cmake -S . -B build -DCTESTS_BUILD_EXAMPLES=OFF
          cmake --build build
          cmake --install build --prefix "$HOME/.local"

      - name: Build a consumer project
        run: |
          mkdir -p /tmp/consumer
          cd /tmp/consumer
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.14)
          project(consumer C)
          find_package(ctests 1.0 REQUIRED)
          add_executable(app main.c)
          target_link_libraries(app PRIVATE ctests::ctests)
          EOF
          cat > main.c <<'EOF'
          #include "ctests.h"
          static void t(void){ EXPECT_EQ_INT(1+1, 2); }
          int main(void){ tt_suite("consumer"); tt_run("ok", t); return tt_summary(); }
          EOF
          cmake -S . -B build -DCMAKE_PREFIX_PATH="$HOME/.local"
          cmake --build build
          ./build/app
